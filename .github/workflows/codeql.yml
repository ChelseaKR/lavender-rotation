name: codeql

# SEC-08 / CICD-20: static analysis over both the Python source and the
# workflow files themselves. Weekly (catches newly-published query packs
# against unchanged code) plus manual dispatch. Findings upload to GHAS code
# scanning (public repo since 2026-07-19) AND the in-run gate below still
# blocks — the dashboard is visibility, the gate is enforcement.

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]  # CI-CD-STANDARD §11e: PRs into main + weekly schedule
  schedule:
    - cron: '17 4 * * 6' # weekly — re-armed 2026-07-11 (metrics plan Phase 0.2)

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write  # SARIF upload to code scanning (public repo)
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "actions"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3
        with:
          languages: ${{ matrix.language }}
          # `+` = *in addition to* the default security suite, never instead of it.
          # AlertSuppression.ql is what turns a reviewed in-source
          # `# codeql[<rule-id>]` comment into a `suppressions` entry on that result
          # in the SARIF, which the gate below is the only thing that honours. Only
          # the python pack ships one, so the actions leg gets no extra query.
          # (`packs`, not `queries`: the `queries` input resolves entries as external
          # *repository* specifiers, so a pack-relative path is rejected there.)
          packs: ${{ matrix.language == 'python' && '+codeql/python-queries:AlertSuppression.ql' || '' }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3
        with:
          category: "/language:${{ matrix.language }}"
          # Upload to GHAS code scanning; the in-run gate below still blocks.
          upload: always
          output: codeql-results

      - name: Fail on findings (blocking gate; GHAS upload above is visibility only)
        shell: bash
        run: |
          # A finding blocks unless CodeQL *itself* reports it as suppressed in
          # source — i.e. an `# codeql[<rule-id>]` comment sits on the line above
          # it, carrying a written justification the reviewer of that PR had to
          # read. The decision stays in the diff next to the code, not in this
          # step: nothing here names a rule or a path, so the gate cannot be
          # widened by editing the workflow, and every other finding of every
          # rule still fails the build.
          suppressed=$(jq -s '[.[] | .runs[]?.results[]? | select((.suppressions // []) | length > 0)] | length' codeql-results/*.sarif)
          count=$(jq -s '[.[] | .runs[]?.results[]? | select((.suppressions // []) | length == 0)] | length' codeql-results/*.sarif)
          echo "CodeQL findings: ${count} blocking, ${suppressed} suppressed in source"
          if [ "${suppressed:-0}" -gt 0 ]; then
            jq -r '.runs[]?.results[]? | select((.suppressions // []) | length > 0) | "  suppressed: \(.ruleId // "rule"): \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // 0)"' codeql-results/*.sarif
          fi
          if [ "${count:-0}" -gt 0 ]; then
            jq -r '.runs[]?.results[]? | select((.suppressions // []) | length == 0) | "\(.ruleId // "rule"): \(.locations[0].physicalLocation.artifactLocation.uri // "?"):\(.locations[0].physicalLocation.region.startLine // 0)"' codeql-results/*.sarif
            exit 1
          fi
