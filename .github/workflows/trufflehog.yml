name: trufflehog

# SEC-19: a scheduled, full-history verified-credentials scan. Complements the
# per-push gitleaks-action layer in ci.yml/release.yml, which only ever sees the
# current diff — this walks the entire repo history on a cadence, independent
# of any single push.

on:
  schedule:
    - cron: "47 6 * * 1" # weekly, Monday
  workflow_dispatch: {}

permissions:
  contents: read

# §11c/§8b: serialize runs; never cancel an in-flight full-history scan.
concurrency:
  group: trufflehog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # full history — this is the point of a scheduled scan

      - name: TruffleHog full-history scan (verified secrets only)
        uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8
        with:
          # Explicit, even though the action defaults it to "./": the v3.96.0
          # action resolves base and head to the same commit when path, base
          # and head are all unset and exits on its own guard ("BASE and HEAD
          # commits are the same. TruffleHog won't scan anything"). Setting it
          # here means a future action bump cannot turn this scan into a no-op.
          path: ./
          # Pinning the action by SHA does NOT pin the scanner. The action's
          # `version` input defaults to "latest" and it runs
          # `ghcr.io/trufflesecurity/trufflehog:${VERSION}`, so every run here
          # was pulling whatever was newest, regardless of the v3.95.8 pin
          # above. The 2026-08-10 run proves it: the log reads "Downloaded
          # newer image for ghcr.io/trufflesecurity/trufflehog:latest" and then
          # reports trufflehog_version 3.96.0.
          version: "3.96.0"
          # The action supplies --fail itself; repeating it in extra_args makes
          # trufflehog abort with "flag 'fail' cannot be repeated" (every
          # scheduled run since 2026-07-20 failed on this, scanning nothing).
          #
          # Lob is excluded because 3.96.0's Lob detector matches this repo's
          # pytest function names. A Lob key is `test_` or `live_` followed by
          # alphanumerics, which is also the shape of 414 test names here, and
          # its verifier confirms them because it cannot tell a malformed key
          # from an unauthorized one. Scanned with 3.95.8 the same history
          # reports 0; with 3.96.0 it reports 19, and nothing in this repo
          # changed between those runs. There is no Lob integration here.
          # Scoped to the one detector rather than excluding tests/ by path,
          # because fixtures are where a real credential is most likely to land
          # by accident.
          extra_args: --results=verified --exclude-detectors=Lob
