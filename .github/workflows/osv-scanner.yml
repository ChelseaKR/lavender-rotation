name: osv-scanner

# SEC-11/SEC-13 completion: scans uv.lock itself (not just the installed
# environment pip-audit already covers in ci.yml), so a lockfile-only
# transitive vulnerability is caught even before anything is installed from it.

on:
  pull_request:
    branches: [main]
    paths: ["uv.lock", "pyproject.toml"]
  schedule:
    - cron: "23 4 * * 1"  # weekly, Monday

permissions:
  contents: read

concurrency:
  group: osv-scanner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      # `actions: read` is required by the called workflow, which declares all
      # three of these itself. A caller that grants fewer permissions than the
      # reusable workflow declares fails before any job starts, which is why
      # every run of this file has been `startup_failure` rather than a normal
      # failure: there was no scan, no log, and no annotation to read, only
      # "This run likely failed because of a workflow file issue."
      # Upstream needs it to upload the SARIF to code scanning; see
      # github/codeql-action#2117.
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2  # v2.3.8
    with:
      scan-args: |-
        --lockfile=uv.lock
