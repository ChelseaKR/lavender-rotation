name: zizmor

# CICD-19 / RTF-06 (zizmor half): static analysis of the workflow files
# themselves (excessive permissions, script injection, unpinned actions, …).
# Scoped to changes under .github/workflows/ so it doesn't run on every PR.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # SARIF upload to code scanning (public repo)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa  # v0.5.7
        with:
          version: "1.26.1"
          # One accepted low finding today: `npm install -g pa11y` in ci.yml/
          # release.yml (adhoc-packages) — a single pinned dev-tool install, not
          # worth a whole package-lock.json for. Blocks on medium+ so a *new*
          # issue still fails the check.
          min-severity: medium
          # Public repo (2026-07-19): upload SARIF to GHAS code scanning while
          # preserving the real exit-code gate. zizmor-action treats
          # advanced-security and annotations as mutually exclusive, so the
          # SARIF/code-scanning path is the one we keep; findings surface there.
          advanced-security: true
          annotations: false
