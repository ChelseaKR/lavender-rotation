name: ci

# Mirrors QUALITY-AND-METRICS-STANDARD §"enforcement pipeline". Every stage is
# blocking; a merge to main requires Python 3.12 and 3.13 green. This is
# enforced, not aspirational: ruleset "main-protection" (id 18752858) is
# applied and active on main and names "verify (3.12)" and "verify (3.13)" as
# required status checks. This comment said "the target ruleset" until
# 2026-08-29; that was true when written and is not now.
# docs/audits/branch-ruleset.json is the committed copy of that posture, and
# ADR 0001 ("Correction, 2026-08-29") records where it and the server differ.
# 3.12 and 3.13 are the whole supported set (ADR 0004, requires-python
# ">=3.12"), so the merge, weekly and on-demand runs cover exactly the same two
# runtimes the PR gate does; there is no wider compatibility matrix to schedule.
# `make verify` runs the exact same stages locally — CI just invokes that one
# target instead of re-listing its steps, so the two cannot drift (CICD-27).

# `push: [main]` was removed on 2026-07-16 (#43) with a reason written into
# this comment: the full supported-version matrix "runs weekly and on demand
# instead of four more times after every merge". That reason was true then and
# is not now — #85 deleted the matrix ternary on 2026-08-15, so every event has
# run the same two runtimes since, and a merge run costs the same two jobs the
# pull-request gate ran rather than four more. What the removal cost is
# measured: of the last 40 commits on `main` (2026-09-10), **8 carry a `ci` run
# on that exact SHA**, and every one of the 8 is a `schedule` or
# `workflow_dispatch` run — not one is a merge. `main`'s HEAD has never been
# verified by this workflow.
#
# The defense that does survive is not the one written down: the ruleset sets
# `strict_required_status_checks_policy`, so a branch must be current with
# `main` to merge and the merged tree therefore equals the tree the PR gate
# read. That covers the merge path and nothing else — `bypass_actors` grants
# the repository-admin role `bypass_mode: always`, so a direct push to `main`
# is possible today and would carry no verdict at all.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "11 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

# A pull-request run is superseded by the next push to the same pull request,
# so cancelling in progress is right there and the group is the PR number.
# Every other event keys on the commit and never cancels. Keyed on
# `github.ref` with `cancel-in-progress: true` — what this was until the `push`
# trigger came back — two merges landing minutes apart would share the group
# `ci-refs/heads/main`, and the second would evict the first: a commit on
# `main` left with a cancelled run, which reads as a failure, proves nothing,
# and is indistinguishable from a job killed by its own timeout.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Floor is >=3.12 (ADR 0004); 3.9 (EOL 2025-10-31) and the 3.10/3.11 era are history,
        # which leaves 3.12 and 3.13 as the complete supported set. Both are
        # required status checks ("verify (3.12)", "verify (3.13)") — renaming
        # or reshaping this list changes those context names and silently
        # detaches the ruleset, so keep it a plain literal.
        #
        # This was a `github.event_name == 'pull_request' && A || B` expression
        # whose two branches were the identical ["3.12", "3.13"], left over from
        # the pre-#51 era when the floor was 3.9 and a wider compatibility
        # matrix existed to defer to the weekly run. It selected nothing, while
        # reading as though scheduled runs covered more runtimes than PRs did.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          # Necessary, and on its own NOT sufficient. This decides how much
          # history lands on disk; what the scanner reads is decided by how it
          # is invoked. The secret-scan step below carried `fetch-depth: 0`
          # while it was scanning only a pull request's own commits, which is
          # exactly what a full-depth checkout plus a range-scoped invocation
          # looks like from the outside: green, and blind to everything older.
          fetch-depth: 0

      # Installs from uv.lock (CQ-09/SEC-13): `--frozen` never re-resolves, so a
      # pyproject.toml/uv.lock drift fails this step instead of silently installing
      # something the lockfile doesn't actually pin.
      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Set up Node (for the pa11y/axe a11y runner)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      - name: Install project (dev + e2e + app groups, pinned via uv.lock)
        run: |
          uv sync --locked --group dev --group e2e --extra app
          npm install -g pa11y@9.1.1  # pinned (zizmor adhoc-packages: was unpinned)

      # The full local gate set — lint, typecheck, test+coverage (incl. the
      # Playwright keyboard/reflow/reduced-motion specs, which use the runner's
      # preinstalled Chrome — no browser download), security (pip-audit +
      # secret-scan.sh), a11y (axe=0), eval (beats popularity baseline), i18n
      # (N/A declaration gate) — in the order Makefile defines.
      # `uv sync` above populates `.venv` at the repo root, which is exactly the
      # Makefile's default `PYTHON ?= .venv/bin/python` — no override needed, so
      # local `make verify` and CI's `make verify` are the literal same command.
      # LAVENDER_E2E_REQUIRE=1 turns the browser specs' no-browser skip into a hard
      # failure here: a silent skip in CI would be the A11Y-03 gap again.
      - name: make verify
        run: make verify
        env:
          LAVENDER_E2E_REQUIRE: "1"

      # The real gitleaks scan, kept alongside `make security`'s
      # scripts/secret-scan.sh, which falls back to a grep heuristic over the
      # working tree when the gitleaks binary is not installed — which is the
      # case in this job, since nothing installs it before `make verify` runs.
      - name: Secret scan (gitleaks, annotated)
        # One scan per workflow is enough; running it inside every
        # compatibility-matrix copy only multiplies identical work.
        if: matrix.python-version == '3.12'
        # This step was `gitleaks/gitleaks-action`, which picks its scan range
        # from the triggering event: on a pull request it scans that pull
        # request's own commits, on a push of one commit it runs
        # `--log-opts=-1`, and only on `schedule` or `workflow_dispatch` does it
        # drop `--log-opts` and read the whole history. This workflow runs on
        # pull_request, schedule and workflow_dispatch, so the lane that gates a
        # merge read the PR's commits and nothing older, while the Tuesday cron
        # read all 183. The `fetch-depth: 0` above did not change that: it
        # governs what is fetched, never what is read.
        #
        # A pinned, checksum-verified binary invoked as `gitleaks git .` with no
        # `--log-opts` walks the history on every event, so the range no longer
        # depends on how the run was triggered.
        run: |
          set -euo pipefail
          GL=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GL}"
          ARCHIVE="gitleaks_${GL}_linux_x64.tar.gz"
          # --retry retries the DOWNLOAD, never the verdict. A transient
          # `curl: (35) Recv failure` from github.com turned this required check
          # red having read zero commits, which is indistinguishable in the
          # check list from a real finding. `curl -f` plus `set -e` still stop
          # the job after the last attempt, and the scan itself runs once.
          curl -sSfL --retry 3 --retry-all-errors --retry-delay 2 \
            -o "/tmp/${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -sSfL --retry 3 --retry-all-errors --retry-delay 2 \
            -o /tmp/gitleaks_checksums.txt "${BASE}/gitleaks_${GL}_checksums.txt"
          (cd /tmp && grep "  ${ARCHIVE}$" gitleaks_checksums.txt | sha256sum --check --strict)
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: audit-artifacts-${{ matrix.python-version }}
          path: docs/audits/
